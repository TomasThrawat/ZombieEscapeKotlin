name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zombie-escape-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: android --no-metrics sdk install platforms/android-37 build-tools/37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: zombie-escape-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
